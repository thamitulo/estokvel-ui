name: Deploy UI to AWS

# Builds the web app (`ng build --configuration production,aws`), uploads it to iKage's S3 bucket
# and refreshes CloudFront (bluetank-infra: apps/ikage). /api/* on the same address goes to the API.
#
# Deploys to staging only. Prod: Actions -> Promote to prod (promote.yml) deploys the same build.
# The `staging` GitHub environment holds the `<app>_github_variables` output of bluetank-infra's
# `staging` workspace.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # OIDC: assume the AWS deploy role without stored keys
  contents: read

env:
  AWS_REGION: af-south-1

jobs:
  staging:
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: deploy-ikage-ui-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npx ng build --configuration production,aws

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: www
          retention-days: 30

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: |
          out=www
          # index.html and the service-worker files must never be cached; everything else for a day.
          aws s3 sync "$out" "s3://${{ vars.UI_BUCKET }}" --delete \
            --exclude index.html --exclude 'ngsw*' --exclude '*.webmanifest' \
            --cache-control 'public,max-age=86400'
          aws s3 sync "$out" "s3://${{ vars.UI_BUCKET }}" \
            --exclude '*' --include index.html --include 'ngsw*' --include '*.webmanifest' \
            --cache-control 'no-cache'

      - name: Refresh CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths '/*'
